<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/general.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./cxcDetail/cxcDetail.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/logo.svg" alt="the simpson logo" />
        <!--- Desktop Menu -->
        <nav class="navBarDesktop"></nav>

        <!-- Opens Mobile Menu-->
        <button class="mobileMenuOpener" popovertarget="mobileMenu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <!--- Mobile Menu -->
        <div popover="" id="mobileMenu">
          <!-- Closes Mobile Menu-->
          <button
            popovertarget="mobileMenu"
            popovertargetaction="hide"
            class="closeButton"
          >
            <i class="fa-solid fa-x"></i>
          </button>
        </div>
      </header>
      <div class="cxcContainer">
        <div class="imgContainer"></div>
        <div class="cxcDetailCOntainer">
          <div class="buttonsC">
            <button class="infoBtn current">Info</button>
            <button class="memesBtn">Memes</button>
          </div>
          <div class="cxcFeatures">
            <div class="info"></div>

            <div class="memes hide"></div>
          </div>
        </div>
      </div>
    </div>
    <dialog id="memeDialog">
      <button class="closeMemeDialog"><i class="fas fa-x"></i></button>
    </dialog>
    <script src="./scripts/general.js"></script>
    <script type="module" src="./cxcDetail.js"></script>
    <script></script>
  </body>
</html>

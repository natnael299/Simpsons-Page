<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/general.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        background-color: #dff7e2;
      }

      .cxcContainer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        margin-top: 150px;
        padding: 0 16px 32px;
        width: 100%;
      }

      .imgContainer {
        display: flex;
        align-items: center;
        justify-content: center;
        position: sticky;
        top: 110px;
        border: 1px solid black;
        background-color: black;
        border-radius: 10px;
        padding: 22px;
        min-width: 280px;
      }

      .imgContainer img {
        width: clamp(180px, 22vw, 300px);
        height: auto;
      }

      .cxcDetailCOntainer {
        display: flex;
        flex-direction: column;
        width: min(92vw, 760px);
      }

      .info.hide,
      .memes.hide {
        display: none;
      }

      .infoBtn.current,
      .memesBtn.current {
        background-color: black;
        color: #fff;
      }

      .buttonsC {
        width: 100%;
        display: flex;
      }

      .buttonsC button {
        width: 180px;
        padding: 10px 0;
        border: 1px solid black;
        cursor: pointer;
      }

      .cxcFeatures {
        border: 2px solid black;
        padding: 0 20px 20px 20px;
        border-bottom-right-radius: 10px;
        border-bottom-left-radius: 10px;
        border-top-right-radius: 10px;
      }

      .cxcFeatures p {
        max-width: 700px;
        line-height: 1.5;
      }

      .info {
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: 15px;
        margin-top: 40px;
      }

      .audioConatiner {
        display: flex;
        gap: 20px;
      }

      .audioConatiner audio {
        width: 250px;
      }

      .memes {
        display: flex;
        max-width: 100%;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .memeContainer {
        cursor: pointer;
      }

      .memes img {
        height: 220px;
        max-width: 100%;
        border-radius: 10px;
      }

      dialog:open {
        position: relative;
        height: min(88vh, 640px);
        width: min(90vw, 700px);
        border: 1px solid black;
        display: flex;
        margin: auto;
        overflow: hidden;
      }

      dialog::backdrop {
        background: #252525;
      }
      dialog button {
        background-color: black;
        color: red;
        border: none;
        z-index: 2;
        position: absolute;
        top: 2px;
        right: 2px;
      }

      dialog img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @media (max-width: 1000px) {
        .cxcContainer {
          flex-direction: column;
          margin-top: 100px;
          gap: 16px;
        }

        .imgContainer {
          position: static;
          width: min(92vw, 520px);
          min-width: 0;
          padding: 14px;
        }

        .imgContainer img {
          width: min(100%, 320px);
        }

        .cxcDetailCOntainer {
          width: min(92vw, 700px);
        }
      }

      @media (max-width: 700px) {
        .buttonsC {
          width: 100%;
        }

        .buttonsC button {
          width: 50%;
          font-size: 0.95rem;
        }

        .cxcFeatures {
          padding: 0 14px 18px;
        }

        .info {
          margin-top: 24px;
          gap: 12px;
        }

        .memes {
          display: grid;
          grid-template-columns: 1fr;
        }

        .memes img {
          width: 100%;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/logo.svg" alt="the simpson logo" />
        <!--- Desktop Menu -->
        <nav class="navBarDesktop"></nav>

        <!-- Opens Mobile Menu-->
        <button class="mobileMenuOpener" popovertarget="mobileMenu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <!--- Mobile Menu -->
        <div popover="" id="mobileMenu">
          <!-- Closes Mobile Menu-->
          <button
            popovertarget="mobileMenu"
            popovertargetaction="hide"
            class="closeButton"
          >
            <i class="fa-solid fa-x"></i>
          </button>
        </div>
      </header>
      <div class="cxcContainer">
        <div class="imgContainer"></div>
        <div class="cxcDetailCOntainer">
          <div class="buttonsC">
            <button class="infoBtn current">Info</button>
            <button class="memesBtn">Memes</button>
          </div>
          <div class="cxcFeatures">
            <div class="info"></div>

            <div class="memes hide"></div>
          </div>
        </div>
      </div>
    </div>
    <dialog id="memeDialog">
      <button class="closeMemeDialog"><i class="fas fa-x"></i></button>
    </dialog>
    <script src="./scripts/general.js"></script>
    <script type="module" src="./cxcDetail.js"></script>
    <script></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./cxcs/cxcs.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <style>
    body {
      background-color: #ffd9b3;
    }

    #hero {
      margin-top: 110px;
      width: 100%;
      padding: 50px 0;
    }

    .heroHeader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(2rem, 5rem, 6rem);
    }

    .description {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .description p {
      max-width: 500px;
      text-align: center;
      line-height: 1.4rem;
    }

    .description a {
      border: 1px solid black;
      border-radius: 12px;
      padding: 10px 12px;
      text-decoration: none;
      color: gold;
      margin-top: 30px;
      background-color: black;
      font-weight: bold;
    }

    .description a:hover {
      opacity: 0.7;
    }
    .heroHeader img {
      width: 590px;
    }
    #characters {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      width: 100%;
      background-color: #0b0b0b;
      color: gold;
    }

    #characters h1 {
      color: gold;
    }

    .inputContainer {
      display: flex;
      align-items: center;
      border: 2px solid black;
      margin: 30px 0;
      height: 55px;
      width: 550px;
      border-radius: 25px;
      padding: 4px;
      background-color: #fff;
    }

    .inputContainer input {
      padding: 5px 0 5px 10px;
      border: none;
      outline: none;
      height: inherit;
      width: inherit;
      background: transparent;
      border-radius: inherit;
    }
    .inputContainer button {
      height: 45px;
      width: 200px;
      border-radius: inherit;
      background-color: black;
      color: gold;
      font-size: 1rem;
      font-weight: bolder;
    }
    .inputContainer button:hover {
      opacity: 0.8;
    }

    #charactersC {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(auto-fill, minmax(350px, 400px));
      row-gap: 50px;
      column-gap: 20px;
      justify-content: center;
      margin-top: 50px;
    }

    .cxc {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cxc img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid gold;
      padding: 10px;
    }

    .cxc .cxcContent {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 10px;
      padding: 10px 20px;
    }
    .cxc .checkBtn {
      padding: 10px 15px;
      border-radius: 10px;
      background-color: #222222;
      color: #fff;
      text-decoration: none;
    }
    .cxc .checkBtn:hover {
      opacity: 0.6;
    }

    .thumbnailC img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      border-radius: 10px;
    }
  </style>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/logo.svg" alt="the simpson logo" />
        <!--- Desktop Menu -->
        <nav class="navBarDesktop"></nav>

        <!-- Opens Mobile Menu-->
        <button class="mobileMenuOpener" popovertarget="mobileMenu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <!--- Mobile Menu -->
        <div popover="" id="mobileMenu">
          <!-- Closes Mobile Menu-->
          <button
            popovertarget="mobileMenu"
            popovertargetaction="hide"
            class="closeButton"
          >
            <i class="fa-solid fa-x"></i>
          </button>
        </div>
      </header>

      <section id="hero">
        <div class="heroHeader">
          <div class="description">
            <h1>Famous Simpsons characters</h1>
            <p>
              Explore iconic characters from the simpsons series. Select your
              fav character & checkout a detailed info about them by pressing
              the explore button.
            </p>
            <a href="#charactersC">Check the characters &rightarrow;</a>
          </div>
          <img src="./assets/simpsons_cast.png" />
        </div>
      </section>

      <section id="characters">
        <h1>prevalent characters from Springfield</h1>
        <div class="inputContainer">
          <input
            type="text"
            placeholder="filter the characters"
            class="inputEle"
          />
          <button class="inputBtn">search &rightarrow;</button>
        </div>

        <div id="charactersC"></div>
      </section>
    </div>
    <script src="./scripts/general.js"></script>
    <script type="module" src="./cxcs/cxcs.js"></script>
  </body>
</html>

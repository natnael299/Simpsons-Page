<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./cxcs/cxcs.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/logo.svg" alt="the simpson logo" />
        <!--- Desktop Menu -->
        <nav class="navBarDesktop"></nav>

        <!-- Opens Mobile Menu-->
        <button class="mobileMenuOpener" popovertarget="mobileMenu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <!--- Mobile Menu -->
        <div popover="" id="mobileMenu">
          <!-- Closes Mobile Menu-->
          <button
            popovertarget="mobileMenu"
            popovertargetaction="hide"
            class="closeButton"
          >
            <i class="fa-solid fa-x"></i>
          </button>
        </div>
      </header>

      <section id="hero">
        <div class="heroHeader">
          <div class="description">
            <h1>Famous Simpsons characters</h1>
            <p>
              Explore iconic characters from the simpsons series. Select your
              fav character & checkout a detailed info about them by pressing
              the explore button.
            </p>
            <a href="#charactersC">Check the characters &rightarrow;</a>
          </div>
          <img src="./assets/simpsons_cast.png" />
        </div>
      </section>

      <section id="characters">
        <h1>prevalent characters from Springfield</h1>
        <div class="inputContainer">
          <input
            type="text"
            placeholder="filter the characters"
            class="inputEle"
          />
          <button class="inputBtn">search &rightarrow;</button>
        </div>

        <div id="charactersC"></div>
      </section>
    </div>
    <dialog class="dialog"></dialog>
    <script src="./scripts/general.js"></script>
    <script type="module" src="./cxcs/cxcs.js"></script>
  </body>
</html>

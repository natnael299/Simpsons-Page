<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./springfield/springfield.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/logo.svg" alt="the simpson logo" />
        <!--- Desktop Menu -->
        <nav class="navBarDesktop"></nav>

        <!-- Opens Mobile Menu-->
        <button class="mobileMenuOpener" popovertarget="mobileMenu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <!--- Mobile Menu -->
        <div popover="" id="mobileMenu">
          <!-- Closes Mobile Menu-->
          <button
            popovertarget="mobileMenu"
            popovertargetaction="hide"
            class="closeButton"
          >
            <i class="fa-solid fa-x"></i>
          </button>
        </div>
      </header>

      <section id="hero">
        <div class="heroHeader">
          <div class="description">
            <h1>Springfield City Overview</h1>
            <p>
              Explore iconic locations from Springfield, including the Simpsons'
              home, Moe's Tavern, and the Kwik-E-Mart. Click any location to
              open its dedicated page with an image gallery.
            </p>
            <a href="#homes">Check the Locations &rightarrow;</a>
          </div>
          <img src="./assets/springfield.jpg" />
        </div>
      </section>

      <section id="locations">
        <h1>prevalent Locations from Springfield</h1>
        <div class="inputContainer">
          <input type="text" placeholder="filter the houses" class="inputEle" />
          <button class="inputBtn">search &rightarrow;</button>
        </div>

        <div id="homes"></div>
      </section>
    </div>
    <script src="./scripts/general.js"></script>
    <script type="module" src="./springfield/springfield.js"></script>
  </body>
</html>
